html/head_include="<meta name=\"theme-color\" content=\"#121214\">
<style>
html, body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
#rotate-hint { display: none; position: fixed; inset: 0; z-index: 10; background: #121214; color: #e8e6e0;
  font: 600 18px/1.4 system-ui, sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px; }
#rotate-hint span { display: block; font-size: 48px; margin-bottom: 12px; }
@media (orientation: portrait) and (pointer: coarse) { #rotate-hint { display: flex; } }
</style>
<script>
document.addEventListener(\"DOMContentLoaded\", function () {
  var d = document.createElement(\"div\");
  d.id = \"rotate-hint\";
  d.innerHTML = \"<div><span>&#x21bb;</span>Turn your phone sideways to play Max Revvin</div>\";
  document.body.appendChild(d);
});
</script>"
